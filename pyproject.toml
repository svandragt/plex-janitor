[project]
name = "plexjanitor"
version = "0.1.0"
description = "clear up plex"
authors = [{ name = "Sander van Dragt", email = "sander@vandragt.com" }]
license = "MIT"
requires-python = ">=3.9"
dependencies = ["plexapi>=4.17.2"]

[dependency-groups]
dev = ["pytest>=8.3.5", "ruff>=0.11.0"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
